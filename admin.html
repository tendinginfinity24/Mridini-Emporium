<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
        .admin-panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 600px; }
        h2 { text-align: center; color: #a35d4d; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #333; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: sans-serif;}
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px;}
        button { width: 100%; padding: 12px; background-color: #a35d4d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s;}
        button:hover { background-color: #8a4e40; }
        #status-message { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .mode-selector { background-color: #e5ded2; padding: 15px; border-radius: 4px; margin-bottom: 25px; }
        .hint { font-size: 11px; color: #666; margin-top: 3px; display: block; }
        .orders-panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 600px; margin-top: 30px;}
        .order-card { border: 1px solid #ccc; padding: 15px; border-radius: 4px; margin-bottom: 15px; background: #fafafa;}
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #a35d4d;}
        
        /* New Colors Section */
        .color-block { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; background: #fdfdfd; border-radius: 4px;}
        .color-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-remove-color { background: #d32f2f; padding: 5px 10px; font-size: 12px; margin: 0; width: auto; }
        .mini-gallery { display: flex; gap: 10px; overflow-x: auto; margin-top: 10px; padding: 5px 0; }
        .mini-thumb-container { position: relative; width: 60px; height: 80px; flex-shrink: 0; border: 1px solid #ccc; }
        .mini-thumb-container img, .mini-thumb-container video { width: 100%; height: 100%; object-fit: cover; }
        .btn-delete-thumb { position: absolute; top: -5px; right: -5px; background: #d32f2f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; padding: 0; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; padding: 10px; }
            .admin-panel, .orders-panel { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div>
        <div class="admin-panel">
            <h2>Product Manager</h2>
            
            <div class="mode-selector">
                <label>Action Mode</label>
                <select id="mode-select">
                    <option value="new">-- ✨ Create New Product ✨ --</option>
                </select>
            </div>

            <form id="product-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="name" required placeholder="e.g. Blush Royale Pleated Gown">
                </div>
                
                <div class="form-group">
                    <label>Categories</label>
                    <input type="text" id="categories" required placeholder="e.g. Gowns, Suits, Best Sellers">
                    <span class="hint">Separate multiple categories with commas.</span>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Original Price (₹)</label>
                        <input type="number" id="originalPrice" placeholder="e.g. 5000">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Sale Price (₹)</label>
                        <input type="number" id="price" required placeholder="e.g. 3500">
                    </div>
                </div>

                <div class="form-group">
                    <label>Sizes</label>
                    <input type="text" id="sizes" placeholder="S, M, L, XL, Custom 42">
                    <span class="hint">Separate sizes with commas.</span>
                </div>

                <div class="form-group">
                    <label>Product Description</label>
                    <textarea id="description" rows="4" placeholder="Fabric details, care instructions, etc..."></textarea>
                </div>

                <div class="form-group" style="border: 2px solid #e5ded2; padding: 15px; border-radius: 4px;">
                    <label style="font-size: 16px; color: #a35d4d; border-bottom: 1px solid #e5ded2; padding-bottom: 5px; margin-bottom: 15px;">Color Variants & Media</label>
                    
                    <div id="colors-container"></div>
                    
                    <button type="button" onclick="addColorBlock()" style="background: #333; margin-top: 10px; font-size: 14px;">+ Add Color Variant</button>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="inStock" checked>
                    <label style="margin: 0;">Item is in stock</label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" id="submit-btn" style="flex: 2; margin-top: 0;">Upload New Product</button>
                    <button type="button" id="delete-btn" style="flex: 1; background-color: #d32f2f; margin-top: 0; display: none;" onclick="deleteProduct()">🗑️ Delete</button>
                </div>
            </form>
            <div id="status-message"></div>
        </div>
        
        <div class="orders-panel">
            <h2>Recent Orders</h2>
            <div id="orders-list">Loading orders...</div>
        </div>
        <div class="orders-panel">
            <h2>Customer Q&A (Unanswered)</h2>
            <div id="qa-list">Loading Q&A...</div>
        </div>
    </div>

    <script>
        // --- SECURITY LOCK ---
        const adminPass = prompt("Enter Admin Password:");
        if (!adminPass) {
            window.location.href = "website.html"; 
        } else {
            fetch('/api/verify-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass })
            }).then(res => {
                if (!res.ok) { alert("Access Denied."); window.location.href = "website.html"; } 
                else { sessionStorage.setItem("admin_pass", adminPass); }
            });
        }

        let allProducts = [];
        let colorBlocksData = []; // Holds the state of our colors UI

        // --- COLOR UI LOGIC ---
        function generateBlockId() { return Math.random().toString(36).substring(7); }

        function addColorBlock(colorName = '', existingMedia = []) {
            colorBlocksData.push({ id: generateBlockId(), colorName, existingMedia });
            renderColors();
        }

        function removeColorBlock(id) {
            colorBlocksData = colorBlocksData.filter(b => b.id !== id);
            renderColors();
        }

        function removeColorMedia(blockId, mediaIndex) {
            const block = colorBlocksData.find(b => b.id === blockId);
            if(block) {
                block.existingMedia.splice(mediaIndex, 1);
                renderColors();
            }
        }

        function updateColorName(blockId, value) {
            const block = colorBlocksData.find(b => b.id === blockId);
            if(block) block.colorName = value;
        }

        function renderColors() {
            const container = document.getElementById('colors-container');
            container.innerHTML = '';
            
            if(colorBlocksData.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#777;">No colors added. Click the button below.</p>';
                return;
            }

            colorBlocksData.forEach((block, index) => {
                let mediaHtml = '';
                if (block.existingMedia && block.existingMedia.length > 0) {
                    mediaHtml = `<div class="mini-gallery">` + block.existingMedia.map((url, mIdx) => {
                        const isVid = url.toLowerCase().endsWith('.mp4');
                        return `
                        <div class="mini-thumb-container">
                            ${isVid ? `<video src="${url}"></video>` : `<img src="${url}">`}
                            <button type="button" class="btn-delete-thumb" onclick="removeColorMedia('${block.id}', ${mIdx})">X</button>
                        </div>`;
                    }).join('') + `</div>`;
                }

                container.insertAdjacentHTML('beforeend', `
                    <div class="color-block">
                        <div class="color-header">
                            <strong>${index === 0 ? 'Primary Color / Default' : 'Variant ' + (index + 1)}</strong>
                            ${index > 0 ? `<button type="button" class="btn-remove-color" onclick="removeColorBlock('${block.id}')">Remove</button>` : ''}
                        </div>
                        <input type="text" value="${block.colorName}" onkeyup="updateColorName('${block.id}', this.value)" placeholder="e.g. Standard, Ruby Red, Emerald" style="margin-bottom: 10px;" required>
                        <input type="file" id="file_${block.id}" multiple accept="image/*,video/mp4,video/webm">
                        <span class="hint">Select new images for this color.</span>
                        ${mediaHtml}
                    </div>
                `);
            });
        }

        // --- CORE LOGIC ---
        async function fetchProductsForDropdown() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                
                const selectEl = document.getElementById('mode-select');
                selectEl.innerHTML = '<option value="new">-- ✨ Create New Product ✨ --</option>';
                allProducts.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = `Edit: ${p.name}`;
                    selectEl.appendChild(option);
                });
            } catch (error) { console.error(error); }
        }

        document.getElementById('mode-select').addEventListener('change', (e) => {
            const selectedId = e.target.value;
            const submitBtn = document.getElementById('submit-btn');
            const deleteBtn = document.getElementById('delete-btn');
            
            colorBlocksData = []; // reset

            if (selectedId === 'new') {
                document.getElementById('product-form').reset();
                submitBtn.innerText = "Upload New Product";
                deleteBtn.style.display = "none";
                addColorBlock(); // Add one default block
            } else {
                const product = allProducts.find(p => p.id == selectedId);
                document.getElementById('name').value = product.name || '';
                // Fallback support for old singular category data
                document.getElementById('categories').value = (product.categories && product.categories.length > 0) ? product.categories.join(', ') : (product.category || '');
                document.getElementById('originalPrice').value = product.originalPrice || '';
                document.getElementById('price').value = product.price || '';
                document.getElementById('description').value = product.description || '';
                document.getElementById('sizes').value = product.sizes ? product.sizes.join(', ') : '';
                document.getElementById('inStock').checked = product.inStock !== false;

                // Load colors or fallback to old media array
                if(product.colors && product.colors.length > 0) {
                    product.colors.forEach(c => addColorBlock(c.colorName, [...c.media]));
                } else if(product.media && product.media.length > 0) {
                    addColorBlock('Standard', [...product.media]);
                } else {
                    addColorBlock();
                }

                submitBtn.innerText = "Save Changes";
                deleteBtn.style.display = "block";
            }
        });

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const selectedMode = document.getElementById('mode-select').value;
            const statusMsg = document.getElementById('status-message');

            statusMsg.innerText = "Processing... Please wait.";
            statusMsg.style.color = "blue";

            try {
                const formData = new FormData();
                formData.append('name', document.getElementById('name').value);
                formData.append('categories', document.getElementById('categories').value);
                formData.append('originalPrice', document.getElementById('originalPrice').value);
                formData.append('price', document.getElementById('price').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('sizes', document.getElementById('sizes').value);
                formData.append('inStock', document.getElementById('inStock').checked);

                // Build Color Data JSON & append files dynamically
                let colorMeta = [];
                colorBlocksData.forEach((block, index) => {
                    colorMeta.push({ colorName: block.colorName || 'Standard', existingMedia: block.existingMedia });
                    const fileInput = document.getElementById(`file_${block.id}`);
                    if(fileInput && fileInput.files) {
                        for(let i=0; i < fileInput.files.length; i++) {
                            formData.append(`media_color_${index}`, fileInput.files[i]);
                        }
                    }
                });
                formData.append('colorData', JSON.stringify(colorMeta));

                const apiUrl = selectedMode === 'new' ? '/api/upload' : `/api/products/${selectedMode}`;
                const fetchMethod = selectedMode === 'new' ? 'POST' : 'PUT';

                const response = await fetch(apiUrl, {
                    method: fetchMethod,
                    headers: { 'admin-password': sessionStorage.getItem('admin_pass') },
                    body: formData 
                });

                if (response.ok) {
                    statusMsg.innerText = selectedMode === 'new' ? "Product uploaded successfully!" : "Product updated!";
                    statusMsg.style.color = "green";
                    if (selectedMode === 'new') {
                        document.getElementById('product-form').reset();
                        colorBlocksData = []; addColorBlock();
                    }
                    await fetchProductsForDropdown();
                    if (selectedMode !== 'new') document.getElementById('mode-select').dispatchEvent(new Event('change'));
                } else throw new Error();
            } catch (error) {
                statusMsg.innerText = "Error saving product. Check server terminal.";
                statusMsg.style.color = "red";
            }
            setTimeout(() => statusMsg.innerText = "", 4000);
        });

        async function deleteProduct() {
            const selectedId = document.getElementById('mode-select').value;
            if (selectedId === 'new') return;
            if (!confirm("🚨 Are you absolutely sure you want to delete this product?")) return;

            try {
                const response = await fetch(`/api/products/${selectedId}`, { 
                    method: 'DELETE',
                    headers: { 'admin-password': sessionStorage.getItem('admin_pass') }
                });
                if (response.ok) {
                    alert("Product permanently deleted.");
                    document.getElementById('mode-select').value = 'new';
                    document.getElementById('mode-select').dispatchEvent(new Event('change')); 
                    fetchProductsForDropdown();
                }
            } catch (error) { alert("Server error."); }
        }

        // --- ORDER MANAGEMENT ---
        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                const container = document.getElementById('orders-list');
                
                if (orders.length === 0) return container.innerHTML = "<p>No orders yet.</p>";
                container.innerHTML = '';
                
                for (let i = orders.length - 1; i >= 0; i--) {
                    const order = orders[i];
                    const itemsHtml = (order.cart || []).map(item => `<div>${item.qty||1}x ${item.name} (Size: ${item.size})</div>`).join('');
                    const c = order.customer || {};
                    
                    let alertHtml = '';
                    if(order.cancellationReason) {
                        let safeVid = order.videoUrl ? (order.videoUrl.startsWith('http') ? order.videoUrl : 'http://localhost:3000'+order.videoUrl) : null;
                        alertHtml = `
                            <div style="margin-top: 10px; padding: 10px; background: #fce4e4; border: 1px solid #f8b4b4;">
                                <strong>⚠️ Return Request:</strong> ${order.cancellationReason} <br>
                                ${safeVid ? `<a href="${safeVid}" target="_blank" style="color:blue;">🔗 Open Video</a>` : ''}
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <span>${order.orderId}</span>
                                <select onchange="updateOrderStatus('${order.orderId}', this.value)">
                                    <option value="Processing" ${order.status==='Processing'?'selected':''}>Processing</option>
                                    <option value="Shipped" ${order.status==='Shipped'?'selected':''}>Shipped</option>
                                    <option value="Delivered" ${order.status==='Delivered'?'selected':''}>Delivered</option>
                                    <option value="Cancelled" ${order.status==='Cancelled'?'selected':''}>Cancelled</option>
                                </select>
                            </div>
                            <div style="font-size:13px;">
                                ${c.firstName||''} ${c.lastName||''} | ${c.phone||''} | ${c.city||''}<br>
                                <strong>Total: ₹${(order.total||0).toFixed(2)}</strong>
                            </div>
                            <div style="margin-top:5px; font-size:12px; border:1px dashed #ccc; padding:5px;">${itemsHtml}</div>
                            ${alertHtml}
                        </div>
                    `;
                }
            } catch (e) {}
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'admin-password': sessionStorage.getItem('admin_pass') },
                    body: JSON.stringify({ status: newStatus })
                });
                alert('Status updated!');
                fetchOrders(); 
            } catch (e) { alert('Failed to update.'); }
        }

        // --- Q&A MANAGEMENT ---
        async function fetchQA() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                const qaContainer = document.getElementById('qa-list');
                let qaHtml = '';

                products.forEach(p => {
                    if (p.comments && p.comments.length > 0) {
                        p.comments.forEach(c => {
                            if (!c.reply) { // Only show comments without an admin reply
                                qaHtml += `
                                <div class="order-card" style="margin-bottom:10px;">
                                    <div style="font-size:12px; color:#777;"><strong>Item:</strong> ${p.name} | <strong>User:</strong> ${c.user} | ${new Date(c.createdAt).toLocaleDateString()}</div>
                                    <p style="margin:8px 0; font-size:14px;"><strong>Q:</strong> ${c.text}</p>
                                    <div style="display:flex; gap:10px; margin-top:10px;">
                                        <input type="text" id="reply-${c._id}" placeholder="Type your official response..." style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
                                        <button onclick="postReply(${p.id}, '${c._id}')" style="width:auto; padding:8px 15px; margin:0; background-color:#333;">Post Reply</button>
                                    </div>
                                </div>`;
                            }
                        });
                    }
                });
                qaContainer.innerHTML = qaHtml || '<p style="font-size:14px; color:#777;">No pending questions. You are all caught up!</p>';
            } catch (e) { console.error("Error fetching QA", e); }
        }

        async function postReply(productId, commentId) {
            const replyText = document.getElementById(`reply-${commentId}`).value.trim();
            if(!replyText) return alert("Reply cannot be empty.");

            try {
                const res = await fetch(`/api/products/${productId}/comments/${commentId}/reply`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'admin-password': sessionStorage.getItem('admin_pass') },
                    body: JSON.stringify({ reply: replyText })
                });
                if(res.ok) {
                    alert('Response posted successfully!');
                    fetchQA(); // Refresh the list
                } else { alert('Failed to post reply.'); }
            } catch (e) { alert('Error posting reply.'); }
        }

        // Initialize UI
        fetchProductsForDropdown();
        fetchOrders();
        fetchQA();
        addColorBlock(); // Add an empty block for "New Product" view
    </script>
</body>
</html>
