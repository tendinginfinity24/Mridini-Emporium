<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
        .admin-panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 500px; }
        h2 { text-align: center; color: #a35d4d; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #333; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: sans-serif;}
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px;}
        button { width: 100%; padding: 12px; background-color: #a35d4d; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s;}
        button:hover { background-color: #8a4e40; }
        #status-message { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
        .mode-selector { background-color: #e5ded2; padding: 15px; border-radius: 4px; margin-bottom: 25px; }
        .hint { font-size: 11px; color: #666; margin-top: 3px; display: block; }
        .orders-panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 600px; margin-top: 30px;}
        .order-card { border: 1px solid #ccc; padding: 15px; border-radius: 4px; margin-bottom: 15px; background: #fafafa;}
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; color: #a35d4d;}
        .order-details { font-size: 14px; color: #333; line-height: 1.5;}
        .order-items { margin-top: 10px; font-size: 13px; color: #555; background: white; padding: 10px; border: 1px dashed #ccc;}
        /* --- MOBILE RESPONSIVENESS --- */
/* --- UPGRADED MOBILE RESPONSIVENESS --- */
@media (max-width: 768px) {
            /* 1. Sleek App-Like Header */
            /* --- THE PERFECT CENTER MOBILE HEADER --- */
        /* --- THE PERFECT CENTER MOBILE HEADER --- */
            /* --- THE PERFECT CENTER MOBILE HEADER --- */
            .top-bar { 
                display: flex !important;
                flex-wrap: wrap !important; /* Allows multiple rows */
                align-items: center !important; 
                justify-content: space-between !important; 
                padding: 10px 15px !important; 
            }

            /* Left Side: Hamburger Menu */
            .hamburger {
                display: flex !important; 
                order: 1 !important;
                flex: 1 1 30% !important; /* Takes exactly 1/3 of the top row */
                justify-content: flex-start !important;
                font-size: 28px !important; /* Made it a tiny bit bigger to match Zimal */
                color: #333 !important;
            }

            /* Center: Logo */
            .logo-container { 
                order: 2 !important; 
                flex: 1 1 40% !important; /* Takes the middle chunk */
                display: flex !important;
                justify-content: center !important;
            }

            /* Right Side: Icons */
            .header-icons { 
                order: 3 !important; 
                flex: 1 1 30% !important; /* Takes exactly 1/3 of the top row */
                display: flex !important;
                justify-content: flex-end !important; 
                gap: 15px !important; 
                margin-top: 0 !important; 
            }

            /* Bottom Row: Search Bar */
            .search-bar { 
                order: 4 !important; 
                flex: 0 0 100% !important; /* The Magic Fix: Do not shrink, take 100% of the next line! */
                width: 100% !important; 
                margin-top: 15px !important; 
                display: flex !important;
                justify-content: center !important;
            }
            
            .search-bar input {
                width: 100% !important;
                padding: 10px 15px !important;
                border-radius: 25px !important; 
                border: 1px solid #ccc !important; /* Adds a nice subtle border like Zimal */
            }

            /* 2. Horizontal Scrolling for Links & Categories */
            .main-nav { 
                display: flex;
                flex-direction: row; 
                flex-wrap: nowrap;
                overflow-x: auto; /* Allows swiping left/right */
                white-space: nowrap; 
                padding: 10px 15px; 
                justify-content: flex-start;
                gap: 20px;
            }
            /* Hide the scrollbar for a cleaner look */
            .main-nav::-webkit-scrollbar { display: none; }
            
            /* 3. Side-by-Side Product Grid */
            /* NOTE: Make sure '.product-grid' matches the actual class name of your product container in your HTML! */
            .product-grid { 
                display: grid; 
                grid-template-columns: 1fr 1fr; /* This is the magic line that creates 2 columns! */
                gap: 10px; 
                padding: 10px;
            }
            .product-card h3 { font-size: 13px; margin-top: 8px; } /* Shrinks text to fit the smaller cards */
            .product-card p { font-size: 14px; font-weight: bold; }
            
            /* 4. Fix Footer & Spacing */
            footer { 
                grid-template-columns: 1fr; 
                text-align: center; 
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <div>
        <div class="admin-panel">
            <h2>Product Manager</h2>
            
            <div class="mode-selector">
                <label>Action Mode</label>
                <select id="mode-select">
                    <option value="new">-- ✨ Create New Product ✨ --</option>
                </select>
            </div>

            <form id="product-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="name" required placeholder="e.g. Blush Royale Pleated Gown">
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="category" required placeholder="e.g. Gowns, Suits...">
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Original Price (₹)</label>
                        <input type="number" id="originalPrice" placeholder="e.g. 5000">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Sale Price (₹)</label>
                        <input type="number" id="price" required placeholder="e.g. 3500">
                    </div>
                </div>

                <div class="form-group">
                    <label>Sizes</label>
                    <input type="text" id="sizes" placeholder="S, M, L, XL, Custom 42">
                    <span class="hint">Separate sizes with commas.</span>
                </div>

                <div class="form-group">
                    <label>Product Description</label>
                    <textarea id="description" rows="4" placeholder="Fabric details, care instructions, etc..."></textarea>
                </div>

                <div id="existing-media-manager" style="display: none; margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                    <label>Manage Current Images</label>
                    <span class="hint" style="margin-bottom: 10px;">Use arrows to arrange order. The leftmost image is the main display. Click X to delete.</span>
                    <div id="media-gallery" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px; background: #fafafa; border: 1px solid #ccc; border-radius: 4px; min-height: 120px;">
                        </div>
                </div>

                <div class="form-group">
                    <label>Upload Media (Images & .mp4)</label>
                    <input type="file" id="product-media" class="form-input" multiple accept="image/*,video/mp4,video/webm">
                    <span class="hint" id="media-hint">Leave blank when editing an existing product to keep current images.</span>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="inStock" checked>
                    <label style="margin: 0;">Item is in stock</label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" id="submit-btn" style="flex: 2; margin-top: 0;">Upload New Product</button>
                    <button type="button" id="delete-btn" style="flex: 1; background-color: #d32f2f; margin-top: 0; display: none;" onclick="deleteProduct()">🗑️ Delete</button>
                </div>
            </form>
            <div id="status-message"></div>
        </div>
        
        <div class="orders-panel">
            <h2>Recent Orders</h2>
            <div id="orders-list">
                Loading orders...
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentMedia = []; // Stores images while editing so you can sort them

        // 1. Fetch products
        async function fetchProductsForDropdown() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                
                const selectEl = document.getElementById('mode-select');
                selectEl.innerHTML = '<option value="new">-- ✨ Create New Product ✨ --</option>';
                
                allProducts.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `Edit: ${product.name}`;
                    selectEl.appendChild(option);
                });
            } catch (error) {
                console.error("Could not load products", error);
            }
        }

        // --- THE GALLERY RENDERER ---
        function renderGallery() {
            const gallery = document.getElementById('media-gallery');
            gallery.innerHTML = '';
            
            if (currentMedia.length === 0) {
                gallery.innerHTML = '<span style="color:#777; font-size:13px; margin: auto;">No images saved to cloud.</span>';
                return;
            }

            currentMedia.forEach((url, index) => {
                const item = document.createElement('div');
                item.style.cssText = "position: relative; min-width: 80px; width: 80px; height: 120px; border: 1px solid #ccc; background: white; flex-shrink: 0;";
                const mediaHtml = url.toLowerCase().endsWith('.mp4') 
                    ? `<video src="${url}" style="width:100%; height:100%; object-fit:cover;"></video>` 
                    : `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
                
                item.innerHTML = `
                    ${mediaHtml}
                    <button type="button" onclick="removeMedia(${index})" style="position:absolute; top:-8px; right:-8px; background:#d32f2f; color:white; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-weight:bold; font-size:12px; z-index:2; padding:0;">X</button>
                    <div style="position:absolute; bottom:0; left:0; width:100%; display:flex; justify-content:space-between; background:rgba(0,0,0,0.6); padding: 2px 0;">
                        <button type="button" onclick="moveMedia(${index}, -1)" style="color:white; background:none; border:none; cursor:pointer; width:50%; font-weight:bold; padding:0;">&lt;</button>
                        <button type="button" onclick="moveMedia(${index}, 1)" style="color:white; background:none; border:none; cursor:pointer; width:50%; font-weight:bold; padding:0;">&gt;</button>
                    </div>
                `;
                gallery.appendChild(item);
            });
        }

        window.removeMedia = (idx) => { currentMedia.splice(idx, 1); renderGallery(); };
        window.moveMedia = (idx, dir) => {
            if (idx + dir < 0 || idx + dir >= currentMedia.length) return;
            const temp = currentMedia[idx];
            currentMedia[idx] = currentMedia[idx + dir];
            currentMedia[idx + dir] = temp;
            renderGallery();
        };

        // 2. Change mode (New vs Edit)
        document.getElementById('mode-select').addEventListener('change', (e) => {
            const selectedId = e.target.value;
            const submitBtn = document.getElementById('submit-btn');
            const deleteBtn = document.getElementById('delete-btn');
            const mediaManager = document.getElementById('existing-media-manager');

            if (selectedId === 'new') {
                document.getElementById('product-form').reset();
                submitBtn.innerText = "Upload New Product";
                deleteBtn.style.display = "none";
                mediaManager.style.display = "none";
                currentMedia = [];
            } else {
                const productToEdit = allProducts.find(p => p.id == selectedId);
                
                document.getElementById('name').value = productToEdit.name || '';
                document.getElementById('category').value = productToEdit.category || '';
                document.getElementById('originalPrice').value = productToEdit.originalPrice || '';
                document.getElementById('price').value = productToEdit.price || '';
                document.getElementById('description').value = productToEdit.description || '';
                document.getElementById('sizes').value = productToEdit.sizes ? productToEdit.sizes.join(', ') : '';
                document.getElementById('inStock').checked = productToEdit.inStock !== false;

                // Load existing images into the gallery manager
                currentMedia = productToEdit.media ? [...productToEdit.media] : [];
                mediaManager.style.display = "block";
                renderGallery();

                submitBtn.innerText = "Save Changes & Images";
                deleteBtn.style.display = "block";
            }
        });

        // 3. Handle Submit
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const selectedMode = document.getElementById('mode-select').value;
            const statusMsg = document.getElementById('status-message');

            statusMsg.innerText = "Processing... Please wait.";
            statusMsg.style.color = "blue";

            try {
                const formData = new FormData();
                formData.append('name', document.getElementById('name').value);
                formData.append('category', document.getElementById('category').value);
                formData.append('originalPrice', document.getElementById('originalPrice').value);
                formData.append('price', document.getElementById('price').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('sizes', document.getElementById('sizes').value);
                formData.append('inStock', document.getElementById('inStock').checked);

                // Pass the custom sorted array back to the server
                if (selectedMode !== 'new') {
                    if (currentMedia.length === 0) formData.append('existingMedia', '');
                    else currentMedia.forEach(url => formData.append('existingMedia', url));
                }

                const fileInput = document.getElementById('product-media');
                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append('mediaFiles', fileInput.files[i]);
                }

                const apiUrl = selectedMode === 'new' ? '/api/upload' : `/api/products/${selectedMode}`;
                const fetchMethod = selectedMode === 'new' ? 'POST' : 'PUT';

                const response = await fetch(apiUrl, {
                    method: fetchMethod,
                    body: formData 
                });

                if (response.ok) {
                    statusMsg.innerText = selectedMode === 'new' ? "Product uploaded successfully!" : "Product and images updated!";
                    statusMsg.style.color = "green";
                    if (selectedMode === 'new') document.getElementById('product-form').reset();
                    
                    await fetchProductsForDropdown();
                    
                    // Auto-refresh the gallery view if we just edited a product
                    if (selectedMode !== 'new') {
                        document.getElementById('mode-select').dispatchEvent(new Event('change'));
                    }
                } else {
                    throw new Error('Upload failed');
                }
            } catch (error) {
                statusMsg.innerText = "Error saving product. Check server terminal.";
                statusMsg.style.color = "red";
            }
            setTimeout(() => statusMsg.innerText = "", 4000);
        });

        // Delete Logic
        async function deleteProduct() {
            const selectedId = document.getElementById('mode-select').value;
            if (selectedId === 'new') return;

            const isSure = confirm("🚨 Are you absolutely sure you want to delete this product? This cannot be undone.");
            if (!isSure) return;

            try {
                const response = await fetch(`/api/products/${selectedId}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("Product permanently deleted from cloud.");
                    document.getElementById('mode-select').value = 'new';
                    document.getElementById('mode-select').dispatchEvent(new Event('change')); 
                    fetchProductsForDropdown();
                } else {
                    alert("Failed to delete product from database.");
                }
            } catch (error) { alert("Server error while trying to delete."); }
        }

        // 4. Fetch Orders
        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                const ordersContainer = document.getElementById('orders-list');
                
                if (orders.length === 0) return ordersContainer.innerHTML = "<p>No orders received yet.</p>";

                ordersContainer.innerHTML = '';
                
                for (let i = orders.length - 1; i >= 0; i--) {
                    const order = orders[i];
                    const cart = order.cart || [];
                    const customer = order.customer || {};
                    const total = order.total || 0;
                    
                    let itemsHtml = cart.map(item => `<div>${item.qty || 1}x ${item.name} (Size: ${item.size})</div>`).join('');

                    const customerDetailsHtml = `
                        <strong>Customer:</strong> ${customer.firstName || 'N/A'} ${customer.lastName || ''} <br>
                        <strong>Phone:</strong> <a href="tel:${customer.phone || ''}" style="color: #1976d2;">${customer.phone || 'N/A'}</a> <br>
                        <strong>Email:</strong> <a href="mailto:${customer.email || ''}" style="color: #1976d2;">${customer.email || 'N/A'}</a> <br>
                        <strong>Address:</strong> ${customer.address || 'N/A'}, ${customer.city || ''}, ${customer.state || ''} - ${customer.pincode || ''} <br>
                        <strong>Total:</strong> ₹${total.toFixed(2)}
                    `;

                    let cancellationAlert = '';
                    if (order.cancellationReason) {
                        let safeVideoUrl = order.videoUrl || '';
                        if (safeVideoUrl && !safeVideoUrl.startsWith('http')) safeVideoUrl = 'http://localhost:3000' + safeVideoUrl;

                        cancellationAlert = `
                            <div style="margin-top: 15px; padding: 15px; background-color: #fce4e4; border: 1px solid #f8b4b4; border-radius: 4px;">
                                <div style="color: #d32f2f; font-weight: bold; margin-bottom: 5px;">⚠️ Cancellation/Return Requested</div>
                                <div style="font-size: 13px; color: #555; margin-bottom: 10px;"><strong>Reason:</strong> ${order.cancellationReason}</div>
                                
                                ${safeVideoUrl ? `
                                <div style="margin-bottom: 10px; padding: 10px; background: white; border-radius: 4px; border: 1px dashed #ccc;">
                                    <a href="${safeVideoUrl}" target="_blank" style="font-size: 13px; color: #1976d2; font-weight: bold;">🔗 Open Video Directly</a>
                                </div>
                                <video width="100%" controls preload="none" style="max-height: 300px; background: #000; border-radius: 4px; margin-bottom: 15px;">
                                    <source src="${safeVideoUrl}" type="video/mp4">
                                </video>
                                ` : `
                                <div style="padding: 10px; background: #fff; color: #d32f2f; font-size: 13px; border: 1px dashed #d32f2f; border-radius: 4px; margin-bottom: 15px;">
                                    ❌ No video URL saved.
                                </div>
                                `}
                                
                                <div style="display: flex; gap: 10px;">
                                    <button onclick="updateOrderStatus('${order.orderId}', 'Cancelled')" style="flex: 1; padding: 10px; background: #2e7d32; color: white;">✓ Approve</button>
                                    <button onclick="updateOrderStatus('${order.orderId}', 'Delivered')" style="flex: 1; padding: 10px; background: #d32f2f; color: white;">✕ Reject</button>
                                </div>
                            </div>
                        `;
                    }

                    ordersContainer.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <span>${order.orderId}</span>
                                <select onchange="updateOrderStatus('${order.orderId}', this.value)" style="width: auto; padding: 2px;">
                                    <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                    <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancellation Requested" ${order.status === 'Cancellation Requested' ? 'selected' : ''}>Cancellation Requested</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                            <div class="order-details">${customerDetailsHtml}</div>
                            <div class="order-items" style="margin-top:10px; font-size:12px;">${itemsHtml}</div>
                            ${cancellationAlert}
                        </div>
                    `;
                }
            } catch (error) { 
                console.error("Failed to load orders:", error); 
            }
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                alert('Order status updated!');
                fetchOrders(); 
            } catch (error) {
                alert('Failed to update status.');
            }
        }

        fetchProductsForDropdown();
        fetchOrders();
    </script>
</body>
</html>
