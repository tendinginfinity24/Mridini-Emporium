<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Mridini</title>
    <style>
        /* Base Styles */
        body { font-family: 'Georgia', serif; margin: 0; padding: 0; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }

        /* --- Header Styles --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #f0f0f0; }
        .search-bar { order: 1; flex: 1; display: flex; justify-content: flex-start; margin-top: 0; }        .search-bar input { padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; font-family: sans-serif; width: 250px; }
        .logo-container { order: 2; flex: 1; display: flex; justify-content: center; }        .logo-img { width: 100px; height: 100px; object-fit: contain; }
        .header-icons { order: 3; flex: 1; display: flex; justify-content: flex-end; gap: 15px; }        .icon-circle { width: 40px; height: 40px; border: 1px solid #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -5px; right: -5px; background-color: #a35d4d; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        
        .main-nav { display: flex; justify-content: center; gap: 30px; padding: 15px 0; font-size: 15px; border-bottom: 1px solid #f0f0f0; }
        .main-nav a:hover { color: #a35d4d; }

        /* --- Shop Layout (Sidebar + Grid) --- */
        .shop-container { display: flex; max-width: 1300px; margin: 40px auto; padding: 0 40px; gap: 50px; }
        
        /* Sidebar Styles */
        .sidebar { width: 220px; flex-shrink: 0; }
        .filter-section { margin-bottom: 40px; }
        .filter-title { font-size: 16px; color: #333; margin-bottom: 20px; }
        
        .filter-list li { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #555; cursor: pointer; }
        .filter-list input[type="radio"] { accent-color: #a35d4d; width: 16px; height: 16px; cursor: pointer; }
        
        /* Faking the dual slider visually for now */
        .price-slider-visual { width: 100%; height: 4px; background-color: #a35d4d; position: relative; margin: 20px 0; border-radius: 2px;}
        .slider-handle { width: 12px; height: 12px; background: white; border: 3px solid #a35d4d; border-radius: 50%; position: absolute; top: -7px; }
        .price-controls { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #555; }
        .reset-btn { background-color: #3b3f46; color: white; border: none; padding: 8px 16px; font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* Product Grid Styles */
        .product-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; align-content: start; }
        .product-card { display: flex; flex-direction: column; position: relative; cursor: pointer;}
        .product-media { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; background-color: #f4f4f4; margin-bottom: 15px; border-radius: 4px; }
        
        /* Pricing UI */
        .price-row { display: flex; gap: 8px; align-items: baseline; }
        .scratched-price { text-decoration: line-through; color: #a0a0a0; font-size: 13px; }
        .selling-price { color: #a35d4d; font-size: 15px; font-weight: bold; }
        .product-price { font-size: 14px; color: #777; }
        .out-of-stock { position: absolute; top: 10px; right: 0; background-color: #d32f2f; color: white; padding: 5px 10px; font-size: 12px; font-weight: bold; font-family: sans-serif; z-index: 2;}

        /* --- Footer Styles --- */
        footer { border-top: 1px solid #eee; padding: 60px 40px 20px 40px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; margin-top: 60px; }
        .footer-brand .logo { text-align: left; margin-bottom: 20px; font-size: 24px; color: #a35d4d; letter-spacing: 4px; }
        .footer-brand p { color: #555; font-size: 14px; max-width: 400px; }
        .footer-column h4 { font-size: 18px; color: #333; margin-bottom: 20px; }
        .footer-column ul li { margin-bottom: 12px; color: #555; font-size: 14px; cursor: pointer; }
        .footer-column ul li:hover { color: #a35d4d; }
        .footer-bottom { grid-column: 1 / -1; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; font-size: 13px; color: #777; }

        /* Hover Cart Styles */
        .product-card { display: flex; flex-direction: column; position: relative; }
        .product-image-wrapper { position: relative; overflow: hidden; display: block; border-radius: 4px; }
        .hover-cart-btn { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); border: none; padding: 15px; 
            color: #a35d4d; font-size: 14px; font-weight: bold; font-family: sans-serif;
            cursor: pointer; transform: translateY(100%); transition: transform 0.3s ease; 
        }
        .product-image-wrapper:hover .hover-cart-btn { transform: translateY(0); }
        /* Hide the mobile filter button on desktop */
        .mobile-filter-btn {
            display: none; 
        }
        /* --- MOBILE RESPONSIVENESS --- */
        /* --- UPGRADED MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            /* 1. Sleek App-Like Header */
            /* --- THE PERFECT CENTER MOBILE HEADER --- */
        /* --- THE PERFECT CENTER MOBILE HEADER --- */
            /* --- THE PERFECT CENTER MOBILE HEADER --- */

            body, html {
                width: 100% !important;
                overflow-x: hidden !important; /* Stops any weird horizontal scrolling */
                margin: 0 !important;
                padding: 0 !important;
            }

        /* Force the header and any main wrappers to take full width */
            header, .wrapper, .container, .main-content {
                width: 100% !important;
                max-width: 100% !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                margin: 0 !important;
                box-sizing: border-box !important;
            }

            .top-bar { 
                display: flex !important;
                flex-wrap: wrap !important; /* Allows multiple rows */
                align-items: center !important; 
                justify-content: space-between !important; 
                padding: 10px 15px !important; 
            }

            /* Left Side: Hamburger Menu */
            .hamburger {
                display: flex !important; 
                order: 1 !important;
                flex: 1 1 30% !important; /* Takes exactly 1/3 of the top row */
                justify-content: flex-start !important;
                font-size: 28px !important; /* Made it a tiny bit bigger to match Zimal */
                color: #333 !important;
            }

            /* Center: Logo */
            .logo-container { 
                order: 2 !important; 
                flex: 1 1 40% !important; /* Takes the middle chunk */
                display: flex !important;
                justify-content: center !important;
            }

            /* Right Side: Icons */
            .header-icons { 
                order: 3 !important; 
                flex: 1 1 30% !important; /* Takes exactly 1/3 of the top row */
                display: flex !important;
                justify-content: flex-end !important; 
                gap: 15px !important; 
                margin-top: 0 !important; 
            }

            /* Bottom Row: Search Bar */
            .search-bar { 
                order: 4 !important; 
                flex: 0 0 100% !important; /* The Magic Fix: Do not shrink, take 100% of the next line! */
                width: 100% !important; 
                margin-top: 15px !important; 
                display: flex !important;
                justify-content: center !important;
            }
            
            .search-bar input {
                width: 100% !important;
                padding: 10px 15px !important;
                border-radius: 25px !important; 
                border: 1px solid #ccc !important; /* Adds a nice subtle border like Zimal */
            }

            /* 2. Horizontal Scrolling for Links & Categories */
            .main-nav { 
                display: flex;
                flex-direction: row; 
                flex-wrap: nowrap;
                overflow-x: auto; /* Allows swiping left/right */
                white-space: nowrap; 
                padding: 10px 15px; 
                justify-content: flex-start;
                gap: 20px;
            }
            /* Hide the scrollbar for a cleaner look */
            .main-nav::-webkit-scrollbar { display: none; }
            
            /* 3. Side-by-Side Product Grid */
            /* NOTE: Make sure '.product-grid' matches the actual class name of your product container in your HTML! */
            /* --- SHOP PAGE MOBILE --- */
        /* Change the main container from row to column */
            /* --- SHOP PAGE MOBILE --- */
        /* --- SHOP PAGE MOBILE --- */
        .shop-container, .shop-layout { 
            display: flex !important;
            flex-direction: column !important; /* Stacks everything */
            padding: 10px !important;
        }

        /* 1. Style the Filter Button */
        .mobile-filter-btn {
            display: flex !important; 
            width: calc(100% - 30px); /* Centers it nicely on the screen */
            margin: 10px auto 0 auto; 
            padding: 12px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid #333;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            cursor: pointer;
        }

        /* 2. Sidebar - Hidden by default, opens directly under the button! */
        .sidebar {
            display: none !important; /* Invisible initially */
            width: 100% !important;
            padding-bottom: 20px !important;
            border-bottom: 1px solid #eee !important; 
            border-right: none !important; 
            margin-bottom: 20px !important; 
        }

        /* The magic class that JS adds to reveal the filters */
        .sidebar.show-filters {
            display: block !important;
        }

        /* 3. Products Grid */
        .product-grid {
            width: 100% !important;
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 10px !important;
            /* We removed the 'order' rules, so HTML handles the order naturally! */
        }
            
            /* 4. Fix Footer & Spacing */
            footer { 
                grid-template-columns: 1fr; 
                text-align: center; 
                padding: 30px 15px;
            }
        }

    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <button id="mobile-filter-btn" class="mobile-filter-btn">
        <span style="font-size: 18px;">⧨</span> Filter
    </button>

    <div class="shop-container">
        
        <aside class="sidebar">
            <div class="filter-section">
                <h3 class="filter-title">Price Range</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="number" id="min-price-input" placeholder="Min ₹" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <span>-</span>
                    <input type="number" id="max-price-input" placeholder="Max ₹" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div class="price-controls" style="margin-top: 15px; display: flex; gap: 10px;">
                    <button id="apply-price-btn" style="flex: 1; background-color: #a35d4d; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 4px;">APPLY</button>
                    <button class="reset-btn" id="reset-price-btn" style="flex: 1; border-radius: 4px;">RESET</button>
                </div>
            </div>

            <div class="filter-section">
                <h3 class="filter-title">Product Categories</h3>
                <ul class="filter-list" id="dynamic-category-list"></ul>
            </div>

            <div class="filter-section">
                <h3 class="filter-title">Size</h3>
                <ul class="filter-list" id="dynamic-size-list"></ul>
            </div>
        </aside>

        <main class="product-grid" id="dynamic-product-grid"></main>

    </div>

    <div id="footer-placeholder"></div>

    <script>
        async function loadShopPage() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const categoryParam = urlParams.get('category');
                const sizeParam = urlParams.get('size');
                
                // FIXED: ALWAYS fetch all products so we don't hit a missing backend route
                const response = await fetch('/api/products');
                let products = await response.json();

                // Client-side Category Filter
                if (categoryParam && categoryParam !== 'all') {
                    products = products.filter(p => p.category && p.category.toLowerCase() === categoryParam.toLowerCase());
                }

                // Client-side Size Filter
                if (sizeParam && sizeParam !== 'all') {
                    products = products.filter(p => p.sizes && p.sizes.some(s => s.toLowerCase() === sizeParam.toLowerCase()));
                }

                // (Existing Code inside loadShopPage)
                // Client-side Category Filter
                if (categoryParam && categoryParam !== 'all') {
                    products = products.filter(p => p.category && p.category.toLowerCase() === categoryParam.toLowerCase());
                }

                // Client-side Size Filter
                if (sizeParam && sizeParam !== 'all') {
                    products = products.filter(p => p.sizes && p.sizes.some(s => s.toLowerCase() === sizeParam.toLowerCase()));
                }

                // --- ADD THIS NEW SEARCH FILTER LOGIC ---
                const searchParam = urlParams.get('search');
                if (searchParam) {
                    const q = searchParam.toLowerCase();
                    products = products.filter(p => 
                        (p.name && p.name.toLowerCase().includes(q)) || 
                        (p.category && p.category.toLowerCase().includes(q)) ||
                        (p.description && p.description.toLowerCase().includes(q))
                    );
                }

                // --- ADD THIS RIGHT AFTER YOUR SIZE FILTER LOGIC ---
                const minPriceParam = urlParams.get('minPrice');
                const maxPriceParam = urlParams.get('maxPrice');

                if (minPriceParam) {
                    products = products.filter(p => Number(p.price) >= Number(minPriceParam));
                    document.getElementById('min-price-input').value = minPriceParam;
                }
                if (maxPriceParam) {
                    products = products.filter(p => Number(p.price) <= Number(maxPriceParam));
                    document.getElementById('max-price-input').value = maxPriceParam;
                }
                // ----------------------------------------------------
                // ----------------------------------------

                const grid = document.getElementById('dynamic-product-grid');
                grid.innerHTML = ''; 

                if (products.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1/-1;">No products found matching these filters.</p>';
                    return;
                }

                // Render the cards safely
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    const stockBadge = product.inStock !== false ? '' : '<div class="out-of-stock">Out of Stock</div>';

                    // Bulletproof Media Extraction
                    let primaryMediaUrl = "https://via.placeholder.com/1080x1920?text=No+Image";
                    if (product.media && Array.isArray(product.media) && product.media.length > 0 && product.media[0]) {
                        primaryMediaUrl = product.media[0];
                    } else if (product.image) {
                        primaryMediaUrl = product.image; 
                    }

                    const safeUrlStr = String(primaryMediaUrl);
                    let mediaHtml = safeUrlStr.toLowerCase().endsWith('.mp4') 
                        ? `<video class="product-media" src="${safeUrlStr}" autoplay loop muted playsinline></video>`
                        : `<img class="product-media" src="${safeUrlStr}" alt="${product.name}">`;

                    const safeOrig = Number(product.originalPrice) || 0;
                    const safePrice = Number(product.price) || 0;

                    let priceHtml = (safeOrig > safePrice)
                        ? `<div class="price-row"><span class="scratched-price">₹${safeOrig.toFixed(2)}</span><span class="selling-price">₹${safePrice.toFixed(2)}</span></div>`
                        : `<div class="product-price">₹${safePrice.toFixed(2)}</div>`;

                    card.innerHTML = `
                        <a href="product.html?id=${product.id}" class="product-image-wrapper">
                            ${stockBadge}
                            ${mediaHtml}
                            <button class="hover-cart-btn" onclick="event.preventDefault(); window.location.href='product.html?id=${product.id}';">👁️ VIEW PRODUCT</button>
                        </a>
                        <a href="product.html?id=${product.id}" style="margin-top: 10px;">
                            <div class="product-title" style="color: #333;">${product.name || "Product"}</div>
                            ${priceHtml}
                        </a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Server connection failed:", error);
            }
        }

        async function loadSidebar() {
            try {
                const response = await fetch('/api/products');
                const allProducts = await response.json();
                const urlParams = new URLSearchParams(window.location.search);

                const categories = [...new Set(allProducts.map(p => p.category))].filter(Boolean);
                const categoryList = document.getElementById('dynamic-category-list');
                categoryList.innerHTML = `<li><input type="radio" name="category" value="all"> All Categories</li>`;
                categories.forEach(cat => {
                    categoryList.innerHTML += `<li><input type="radio" name="category" value="${cat}"> ${cat}</li>`;
                });

                const rawSizes = allProducts.flatMap(p => p.sizes || []);
                const uniqueSizes = [...new Set(rawSizes.map(s => s.trim()))].filter(Boolean);
                const sizeList = document.getElementById('dynamic-size-list');
                sizeList.innerHTML = `<li><input type="radio" name="size" value="all"> All Sizes</li>`;
                uniqueSizes.forEach(size => {
                    sizeList.innerHTML += `<li><input type="radio" name="size" value="${size}"> ${size}</li>`;
                });

                const activeCat = urlParams.get('category');
                if (activeCat) {
                    const catRadio = document.querySelector(`input[name="category"][value="${activeCat}"]`);
                    if (catRadio) catRadio.checked = true;
                }

                const activeSize = urlParams.get('size');
                if (activeSize) {
                    const sizeRadio = document.querySelector(`input[name="size"][value="${activeSize}"]`);
                    if (sizeRadio) sizeRadio.checked = true;
                }

                document.querySelector('.sidebar').addEventListener('change', (e) => {
                    if (e.target.name === 'category' || e.target.name === 'size') {
                        const filterType = e.target.name;
                        const filterValue = e.target.value;
                        const currentParams = new URLSearchParams(window.location.search);
                        
                        if (filterValue === 'all') currentParams.delete(filterType);
                        else currentParams.set(filterType, filterValue);

                        window.location.search = currentParams.toString();
                    }
                });

            } catch (error) {
                console.error("Failed to load dynamic sidebar:", error);
            }
        }

        // Make the Price Apply button work
        document.getElementById('apply-price-btn')?.addEventListener('click', () => {
            const min = document.getElementById('min-price-input').value;
            const max = document.getElementById('max-price-input').value;
            const currentParams = new URLSearchParams(window.location.search);
            
            if (min) currentParams.set('minPrice', min); else currentParams.delete('minPrice');
            if (max) currentParams.set('maxPrice', max); else currentParams.delete('maxPrice');
            
            window.location.search = currentParams.toString();
        });

        // Make the Price Reset button work
        document.getElementById('reset-price-btn')?.addEventListener('click', () => {
            const currentParams = new URLSearchParams(window.location.search);
            currentParams.delete('minPrice');
            currentParams.delete('maxPrice');
            window.location.search = currentParams.toString();
        });

        loadShopPage();
        loadSidebar();




    </script>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const scripts = document.getElementById('header-placeholder').getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) eval(scripts[i].innerText);
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-placeholder').innerHTML = data);
    </script>
    <script>
        // Make the Mobile Filter Button work
        const filterBtn = document.getElementById('mobile-filter-btn');
        
        if(filterBtn) {
            filterBtn.addEventListener('click', function() {
                // Find your sidebar (change '.sidebar' if you named it something else!)
                const sidebar = document.querySelector('.sidebar') || document.querySelector('.filter-sidebar');
                
                if(sidebar) {
                    // This toggles the magic CSS class on and off
                    sidebar.classList.toggle('show-filters');
                }
            });
        }
    </script>
</body>
</html>
