<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Mridini</title>
    <style>
        /* Base & Header */
        body { font-family: 'Georgia', serif; margin: 0; padding: 0; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #f0f0f0; }
        .search-bar { flex: 1; display: flex; justify-content: flex-start; }
        .search-bar input { padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; font-family: sans-serif; width: 250px; }
        .logo-container { flex: 1; display: flex; justify-content: center; }
        .logo-img { width: 100px; height: 100px; object-fit: contain; }
        .header-icons { flex: 1; display: flex; justify-content: flex-end; gap: 15px; }
        .icon-circle { width: 40px; height: 40px; border: 1px solid #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -5px; right: -5px; background-color: #a35d4d; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        .main-nav { display: flex; justify-content: center; gap: 30px; padding: 15px 0; font-size: 15px; border-bottom: 1px solid #f0f0f0; }
        .main-nav a:hover { color: #a35d4d; }

        /* --- Product Page Layout --- */
        .product-layout {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* ZOOM WRAPPER */
        .zoom-wrapper {
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            cursor: crosshair;
            border-radius: 4px;
            background-color: #f4f4f4;
            position: relative;
        }
        
        .zoom-wrapper img, .zoom-wrapper video {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.1s ease-out; 
        }

        /* Left Side: Gallery */
        .gallery-container { flex: 1; display: flex; flex-direction: column; gap: 15px; max-width: 50%; }
        .thumbnail-row { display: flex; gap: 10px; overflow-x: auto; }
        .thumb { width: 80px; height: 120px; object-fit: cover; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
        .thumb.active { border-color: #a35d4d; opacity: 1; }

        /* Right Side: Details */
        .details-container { flex: 1; padding-top: 20px; }
        .breadcrumb { font-size: 12px; color: #777; margin-bottom: 15px; }
        .product-title { font-size: 28px; color: #333; margin-bottom: 15px; font-weight: normal; }
        .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 30px; }
        .scratched-price { text-decoration: line-through; color: #999; font-size: 18px; }
        .selling-price { color: #a35d4d; font-size: 24px; font-weight: bold; }

        /* Sizes */
        .size-section { margin-bottom: 30px; }
        .size-label { font-size: 14px; margin-bottom: 10px; display: block; color: #555; }
        .size-options { display: flex; flex-wrap: wrap; gap: 10px; }
        .size-btn { min-width: 40px; padding: 0 10px; height: 40px; border: 1px solid #ccc; border-radius: 20px; background: white; font-family: sans-serif; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .size-btn.selected { border-color: #a35d4d; background: #a35d4d; color: white; }

        /* Actions */
        .action-row { display: flex; gap: 15px; margin-bottom: 40px; }
        .qty-input { width: 60px; padding: 12px; border: 1px solid #ccc; text-align: center; font-size: 16px; border-radius: 4px; }
        .btn-add { flex: 1; background-color: #d1b8a4; color: white; border: none; font-weight: bold; font-family: sans-serif; cursor: pointer; letter-spacing: 1px; border-radius: 4px; }
        .btn-buy { flex: 1; background-color: #333; color: white; border: none; font-weight: bold; font-family: sans-serif; cursor: pointer; letter-spacing: 1px; border-radius: 4px; }
        .btn-add:hover, .btn-buy:hover { filter: brightness(0.9); }

        /* Tabs */
        .tabs { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; display: flex; gap: 30px; font-size: 13px; font-weight: bold; font-family: sans-serif; margin-bottom: 20px;}
        .tab { cursor: pointer; color: #777; }
        .tab.active { color: #333; border-bottom: 2px solid #333; padding-bottom: 14px; }
        .description-content { font-size: 14px; color: #555; line-height: 1.8; }

        /* Related Products */
        .related-section { max-width: 1200px; margin: 80px auto; padding: 0 20px; }
        .related-title { text-align: center; font-size: 20px; letter-spacing: 2px; margin-bottom: 40px; }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .product-card { display: block; }
        .product-card img, .product-card video { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 4px; }
        .product-card-title { font-size: 14px; margin: 10px 0 5px 0; color: #333; }
        .product-card-price { font-size: 14px; color: #777; }

        /* --- Footer Styles --- */
        footer { border-top: 1px solid #eee; padding: 60px 40px 20px 40px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; margin-top: 60px; }
        .footer-brand .logo { text-align: left; margin-bottom: 20px; font-size: 24px; color: #a35d4d; letter-spacing: 4px; }
        .footer-brand p { color: #555; font-size: 14px; max-width: 400px; }
        .footer-column h4 { font-size: 18px; color: #333; margin-bottom: 20px; }
        .footer-column ul li { margin-bottom: 12px; color: #555; font-size: 14px; cursor: pointer; }
        .footer-column ul li:hover { color: #a35d4d; }
        .footer-bottom { grid-column: 1 / -1; margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; font-size: 13px; color: #777; }
        /* --- MOBILE RESPONSIVENESS --- */
                /* --- UPGRADED MOBILE RESPONSIVENESS --- */
        
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div id="single-product-container" class="product-layout">
        </div>

    <div class="related-section">
        <h3 class="related-title">YOU MIGHT ALSO LIKE</h3>
        <div class="related-grid" id="related-grid"></div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        // --- GLOBALS ---
        let autoSlideTimer;
        window.currentSlideIndex = 0;
        window.productMediaArray = [];

        // --- ZOOM LOGIC ---
        function handleZoom(e) {
            const wrapper = e.currentTarget;
            const img = document.getElementById('main-display');
            if(!img || img.tagName.toLowerCase() === 'video') return; 
            
            const rect = wrapper.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            
            img.style.transformOrigin = `${x}% ${y}%`;
            img.style.transform = 'scale(2.5)';
        }

        function resetZoom() {
            const img = document.getElementById('main-display');
            if(img) {
                img.style.transformOrigin = 'center center';
                img.style.transform = 'scale(1)';
            }
        }

        // --- SLIDER LOGIC ---
        function startAutoSlide() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(() => {
                if (!window.productMediaArray || window.productMediaArray.length <= 1) return;
                window.currentSlideIndex = (window.currentSlideIndex + 1) % window.productMediaArray.length;
                const nextUrl = window.productMediaArray[window.currentSlideIndex];
                const isVideo = String(nextUrl).toLowerCase().endsWith('.mp4');
                const thumbElements = document.querySelectorAll('.thumb');
                const targetThumb = thumbElements[window.currentSlideIndex];
                
                changeMedia(nextUrl, isVideo, targetThumb, true);
            }, 3500);
        }

        function changeMedia(url, isVideo, element, isAuto = false) {
            const container = document.querySelector('.zoom-wrapper'); 
            const oldDisplay = document.getElementById('main-display');
            if(oldDisplay) oldDisplay.remove();
            
            const newElement = isVideo 
                ? `<video class="main-media" id="main-display" src="${url}" autoplay loop muted playsinline></video>`
                : `<img class="main-media" id="main-display" src="${url}">`;
            container.insertAdjacentHTML('afterbegin', newElement);

            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');

            if (!isAuto && window.productMediaArray) {
                window.currentSlideIndex = window.productMediaArray.indexOf(url);
                startAutoSlide();
            }
        }

        // --- MAIN PAGE LOAD LOGIC ---
        async function loadProductPage() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');

                if (!productId) {
                    document.getElementById('single-product-container').innerHTML = "<h3 style='width:100%; text-align:center;'>Product not found in URL.</h3>";
                    return;
                }

                const response = await fetch('/api/products');
                const allProducts = await response.json();
                const product = allProducts.find(p => p.id == productId);

                if (!product) {
                    document.getElementById('single-product-container').innerHTML = "<h3 style='width:100%; text-align:center;'>Product not found in database.</h3>";
                    return;
                }

                // BULLETPROOF DATA EXTRACTION
                // Safely extract media
                let mediaArray = ["https://via.placeholder.com/1080x1920?text=No+Image"];
                if (product.media && Array.isArray(product.media) && product.media.length > 0 && product.media[0]) {
                    mediaArray = product.media;
                } else if (product.image) {
                    mediaArray = [product.image];
                }
                window.productMediaArray = mediaArray;
                window.currentSlideIndex = 0;

                const firstMedia = String(mediaArray[0]);
                const isMainVideo = firstMedia.toLowerCase().endsWith('.mp4');
                let mainMediaHtml = isMainVideo 
                    ? `<video class="main-media" id="main-display" src="${firstMedia}" autoplay loop muted playsinline></video>`
                    : `<img class="main-media" id="main-display" src="${firstMedia}">`;

                let thumbsHtml = mediaArray.map((url, index) => {
                    const cleanUrl = String(url);
                    const isVid = cleanUrl.toLowerCase().endsWith('.mp4');
                    const activeClass = index === 0 ? 'active' : '';
                    if (isVid) return `<video class="thumb ${activeClass}" src="${cleanUrl}" onclick="changeMedia('${cleanUrl}', true, this)"></video>`;
                    return `<img class="thumb ${activeClass}" src="${cleanUrl}" onclick="changeMedia('${cleanUrl}', false, this)">`;
                }).join('');

                // Safely extract prices (forces them to be numbers to prevent crash)
                const safePrice = Number(product.price) || 0;
                const safeOrig = Number(product.originalPrice) || 0;
                
                let priceHtml = '';
                if (safeOrig > safePrice) {
                    priceHtml = `<span class="scratched-price">₹${safeOrig.toFixed(2)}</span><span class="selling-price">₹${safePrice.toFixed(2)}</span>`;
                } else {
                    priceHtml = `<span class="selling-price">₹${safePrice.toFixed(2)}</span>`;
                }

                // Safely extract text
                const safeName = product.name ? String(product.name).replace(/'/g, "\\'") : "Unnamed Product";
                const safeDesc = product.description ? String(product.description).replace(/\n/g, '<br>') : "Disclaimer: Slight colour variations may occur due to different screen resolutions.<br>Care: Dry clean only.";
                const safeCat = product.category ? String(product.category) : "Category";

                // Safely extract sizes
                let sizesHtml = '';
                if (product.sizes && Array.isArray(product.sizes) && product.sizes.length > 0) {
                    sizesHtml = product.sizes.map(size => `<button class="size-btn" onclick="selectSize(this, '${String(size)}')">${size}</button>`).join('');
                } else {
                    sizesHtml = `<span style="font-size: 13px; color: #777;">One Size</span>`;
                }

                // INJECT HTML
                document.getElementById('single-product-container').innerHTML = `
                    <div class="gallery-container">
                        <div class="zoom-wrapper" onmousemove="handleZoom(event)" onmouseleave="resetZoom()">
                            ${mainMediaHtml}
                        </div>
                        <div class="thumbnail-row">${thumbsHtml}</div>
                    </div>
                    <div class="details-container">
                        <div class="breadcrumb">${product.id} - ${safeCat}</div>
                        <h1 class="product-title">${safeName}</h1>
                        <div class="price-row">${priceHtml}</div>
                        
                        <div class="size-section">
                            <span class="size-label">Size</span>
                            <div class="size-options">${sizesHtml}</div>
                        </div>

                        <div class="action-row">
                            <input type="number" id="qty-input" class="qty-input" value="1" min="1">
                            
                            <button class="btn-add" onclick="addToBasket(${product.id}, '${safeName}', ${safePrice}, '${firstMedia}')">ADD TO BASKET</button>
                            <button class="btn-buy" onclick="buyNow(${product.id}, '${safeName}', ${safePrice}, '${firstMedia}')">BUY NOW</button>
                        </div>
                        
                        <div class="tabs">
                            <div class="tab active">DESCRIPTION</div>
                            <div class="tab">ADDITIONAL INFORMATION</div>
                        </div>
                        <div class="description-content">
                            <p>${safeDesc}</p>
                        </div>
                    </div>
                `;

                startAutoSlide();

                // BULLETPROOF RELATED PRODUCTS
                const relatedProducts = allProducts.filter(p => p.category === product.category && p.id != productId).slice(0, 4);
                const relatedGrid = document.getElementById('related-grid');
                
                if (relatedProducts.length === 0) {
                    relatedGrid.innerHTML = "<p>No related products found.</p>";
                } else {
                    relatedProducts.forEach(rel => {
                        let rMedia = (rel.media && Array.isArray(rel.media) && rel.media[0]) ? rel.media[0] : (rel.image || "https://via.placeholder.com/1080x1920?text=No+Image");
                        let rMediaStr = String(rMedia);
                        let relMediaHtml = rMediaStr.toLowerCase().endsWith('.mp4') ? `<video src="${rMediaStr}" autoplay loop muted playsinline></video>` : `<img src="${rMediaStr}">`;
                        
                        let rPrice = Number(rel.price) || 0;
                        let rOrig = Number(rel.originalPrice) || 0;

                        let relPriceHtml = (rOrig > rPrice)
                            ? `<span style="text-decoration:line-through; color:#999; margin-right:5px;">₹${rOrig.toFixed(2)}</span>₹${rPrice.toFixed(2)}`
                            : `₹${rPrice.toFixed(2)}`;

                        relatedGrid.innerHTML += `
                            <a href="product.html?id=${rel.id}" class="product-card">
                                ${relMediaHtml}
                                <div class="product-card-title">${rel.name || "Product"}</div>
                                <div class="product-card-price">${relPriceHtml}</div>
                            </a>
                        `;
                    });
                }

            } catch (error) {
                console.error("Critical error building page:", error);
                document.getElementById('single-product-container').innerHTML = "<h3 style='color:red; width:100%; text-align:center;'>Error loading product interface. Check console.</h3>";
            }
        }

        // --- CART LOGIC ---
        let currentSelectedSize = null; 

        function selectSize(btn, size) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentSelectedSize = size;
        }

        function addToBasket(id, name, price, image) {
            if (!currentSelectedSize && document.querySelectorAll('.size-btn').length > 0) {
                alert('Please select a size before adding to basket!');
                return false; 
            }

            const qty = parseInt(document.getElementById('qty-input').value) || 1;
            const finalSize = currentSelectedSize || 'One Size';
            const cartItem = { id, name, price, image, size: finalSize, qty };

            let cart = JSON.parse(localStorage.getItem('mridini_cart')) || [];

            const existingItemIndex = cart.findIndex(item => item.id === id && item.size === finalSize);
            if (existingItemIndex > -1) {
                cart[existingItemIndex].qty += qty; 
            } else {
                cart.push(cartItem); 
            }

            localStorage.setItem('mridini_cart', JSON.stringify(cart));
            updateCartBadge();

            const btn = document.querySelector('.btn-add');
            const originalText = btn.innerText;
            const originalColor = btn.style.backgroundColor;
            btn.innerText = '✓ ADDED TO BAG';
            btn.style.backgroundColor = '#4CAF50'; 
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = originalColor;
            }, 2000);

            return true;
        }

        function buyNow(id, name, price, image) {
            const success = addToBasket(id, name, price, image);
            if (success) window.location.href = 'cart.html'; 
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('mridini_cart')) || [];
            const totalItems = cart.reduce((total, item) => total + item.qty, 0);
            document.querySelectorAll('.cart-count').forEach(badge => {
                badge.innerText = totalItems;
            });
        }

        updateCartBadge();
        loadProductPage();
    </script>

    <script>
        // Inject Header and Footer
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const scripts = document.getElementById('header-placeholder').getElementsByTagName('script');
                for (let i = 0; i < scripts.length; i++) {
                    eval(scripts[i].innerText);
                }
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
