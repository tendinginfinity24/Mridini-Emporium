<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Mridini</title>
    <style>
        body { font-family: 'Georgia', serif; margin: 0; padding: 0; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #f0f0f0; }
        .search-bar { order: 1; flex: 1; display: flex; justify-content: flex-start; margin-top: 0; }
        .search-bar input { padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; font-family: sans-serif; width: 250px; }
        .logo-container { order: 2; flex: 1; display: flex; justify-content: center; }
        .logo-img { width: 100px; height: 100px; object-fit: contain; }
        .header-icons { order: 3; flex: 1; display: flex; justify-content: flex-end; gap: 15px; }
        .icon-circle { width: 40px; height: 40px; border: 1px solid #ccc; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -5px; right: -5px; background-color: #a35d4d; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        .main-nav { display: flex; justify-content: center; gap: 30px; padding: 15px 0; font-size: 15px; border-bottom: 1px solid #f0f0f0; }
        .main-nav a:hover { color: #a35d4d; }

        .product-layout { display: flex; gap: 40px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .zoom-wrapper { width: 100%; aspect-ratio: 9 / 16; overflow: hidden; cursor: crosshair; border-radius: 4px; background-color: #f4f4f4; position: relative; }
        .zoom-wrapper img, .zoom-wrapper video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s ease-out; }

        .gallery-container { flex: 1; display: flex; flex-direction: column; gap: 15px; max-width: 50%; }
        .thumbnail-row { display: flex; gap: 10px; overflow-x: auto; }
        .thumb { width: 80px; height: 120px; object-fit: cover; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
        .thumb.active { border-color: #a35d4d; opacity: 1; }

        .details-container { flex: 1; padding-top: 20px; }
        .breadcrumb { font-size: 12px; color: #777; margin-bottom: 15px; }
        .product-title { font-size: 28px; color: #333; margin-bottom: 15px; font-weight: normal; }
        .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 25px; }
        .scratched-price { text-decoration: line-through; color: #999; font-size: 18px; }
        .selling-price { color: #a35d4d; font-size: 24px; font-weight: bold; }

        .selector-section { margin-bottom: 25px; }
        .selector-label { font-size: 14px; margin-bottom: 10px; display: block; color: #555; }
        .selector-options { display: flex; flex-wrap: wrap; gap: 10px; }
        .selector-btn { padding: 8px 15px; border: 1px solid #ccc; border-radius: 20px; background: white; font-family: sans-serif; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .selector-btn.selected { border-color: #a35d4d; background: #a35d4d; color: white; }

        .action-row { display: flex; gap: 15px; margin-bottom: 40px; }
        .qty-input { width: 60px; padding: 12px; border: 1px solid #ccc; text-align: center; font-size: 16px; border-radius: 4px; }
        .btn-add { flex: 1; background-color: #d1b8a4; color: white; border: none; font-weight: bold; font-family: sans-serif; cursor: pointer; letter-spacing: 1px; border-radius: 4px; }
        .btn-buy { flex: 1; background-color: #333; color: white; border: none; font-weight: bold; font-family: sans-serif; cursor: pointer; letter-spacing: 1px; border-radius: 4px; }
        .btn-add:hover, .btn-buy:hover { filter: brightness(0.9); }

        .tabs { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; display: flex; gap: 30px; font-size: 13px; font-weight: bold; font-family: sans-serif; margin-bottom: 20px;}
        .tab { cursor: pointer; color: #777; }
        .tab.active { color: #333; border-bottom: 2px solid #333; padding-bottom: 14px; }
        .description-content { font-size: 14px; color: #555; line-height: 1.8; }

        .comments-section { max-width: 1200px; margin: 60px auto 20px auto; padding: 40px 20px; border-top: 1px solid #eee; }
        .comments-title { font-size: 20px; margin-bottom: 20px; font-weight: normal; letter-spacing: 1px;}
        .comment-form { display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin-bottom: 40px; }
        .comment-input { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif; }
        .comment-submit { padding: 12px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; align-self: flex-start; }
        .comment-box { background: #fafafa; padding: 20px; border-radius: 4px; border-left: 3px solid #a35d4d; margin-bottom: 15px;}
        .comment-meta { font-size: 12px; color: #777; margin-bottom: 8px; display: flex; justify-content: space-between;}
        .comment-reply { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd; font-size: 13px; color: #555;}

        .related-section { max-width: 1200px; margin: 40px auto 80px auto; padding: 0 20px; }
        .related-title { text-align: center; font-size: 20px; letter-spacing: 2px; margin-bottom: 40px; }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .product-card img, .product-card video { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 4px; }
        .product-card-title { font-size: 14px; margin: 10px 0 5px 0; color: #333; }
        .product-card-price { font-size: 14px; color: #777; }

        footer { border-top: 1px solid #eee; padding: 60px 40px 20px 40px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; margin-top: 60px; }
        .footer-brand .logo { text-align: left; margin-bottom: 20px; font-size: 24px; color: #a35d4d; letter-spacing: 4px; }
        
        @media (max-width: 768px) {
            body, html { width: 100% !important; overflow-x: hidden !important; margin: 0 !important; padding: 0 !important; }
            header, .wrapper, .container, .main-content { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; box-sizing: border-box !important; }
            .top-bar { display: flex !important; box-sizing: border-box !important; flex-wrap: wrap !important; align-items: center !important; justify-content: space-between !important; padding: 10px 15px !important; }
            .hamburger { display: flex !important; order: 1 !important; flex: 1 1 30% !important; justify-content: flex-start !important; font-size: 28px !important; color: #333 !important; }
            .logo-container { order: 2 !important; flex: 1 1 40% !important; display: flex !important; justify-content: center !important; }
            .header-icons { order: 3 !important; flex: 1 1 30% !important; display: flex !important; justify-content: flex-end !important; gap: 15px !important; margin-top: 0 !important; }
            .search-bar { order: 4 !important; flex: 0 0 100% !important; width: 100% !important; margin-top: 15px !important; display: flex !important; justify-content: center !important; }
            .search-bar input { width: 100% !important; padding: 10px 15px !important; border-radius: 25px !important; border: 1px solid #ccc !important; }
            .main-nav { display: flex; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; padding: 10px 15px; justify-content: flex-start; gap: 20px; }
            .main-nav::-webkit-scrollbar { display: none; }
            .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
            
            .product-layout { display: flex !important; flex-direction: column !important; width: 100% !important; padding: 15px !important; margin: 0 !important; box-sizing: border-box !important; }
            .gallery-container { width: 100% !important; max-width: 100% !important; margin-bottom: 20px !important; display: flex !important; flex-direction: column !important; }
            .details-container { width: 100% !important; max-width: 100% !important; padding: 0 !important; box-sizing: border-box !important; }
            footer { grid-template-columns: 1fr; text-align: center; padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div id="single-product-container" class="product-layout"></div>

    <div class="comments-section">
        <h3 class="comments-title">Customer Questions & Reviews</h3>
        
        <div class="comment-form">
            <input type="text" id="comment-user" class="comment-input" placeholder="Your Name (Optional)">
            <textarea id="comment-text" class="comment-input" rows="3" placeholder="Ask a question or leave a review..."></textarea>
            <button onclick="submitComment()" class="comment-submit">Post to Discussion</button>
        </div>

        <div id="comments-feed"></div>
    </div>

    <div class="related-section">
        <h3 class="related-title">YOU MIGHT ALSO LIKE</h3>
        <div class="related-grid" id="related-grid"></div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        let autoSlideTimer;
        window.currentSlideIndex = 0;
        window.productMediaArray = [];
        window.currentSelectedColorName = 'Standard';
        window.globalProductData = null; 

        function handleZoom(e) {
            const wrapper = e.currentTarget;
            const img = document.getElementById('main-display');
            if(!img || img.tagName.toLowerCase() === 'video') return; 
            const rect = wrapper.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            img.style.transformOrigin = `${x}% ${y}%`;
            img.style.transform = 'scale(2.5)';
        }

        function resetZoom() {
            const img = document.getElementById('main-display');
            if(img) { img.style.transformOrigin = 'center center'; img.style.transform = 'scale(1)'; }
        }

        function startAutoSlide() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(() => {
                if (!window.productMediaArray || window.productMediaArray.length <= 1) return;
                window.currentSlideIndex = (window.currentSlideIndex + 1) % window.productMediaArray.length;
                const nextUrl = window.productMediaArray[window.currentSlideIndex];
                const isVideo = String(nextUrl).toLowerCase().endsWith('.mp4');
                const thumbElements = document.querySelectorAll('.thumb');
                const targetThumb = thumbElements[window.currentSlideIndex];
                changeMedia(nextUrl, isVideo, targetThumb, true);
            }, 3500);
        }

        function changeMedia(url, isVideo, element, isAuto = false) {
            const container = document.querySelector('.zoom-wrapper'); 
            const oldDisplay = document.getElementById('main-display');
            if(oldDisplay) oldDisplay.remove();
            
            const newElement = isVideo 
                ? `<video class="main-media" id="main-display" src="${url}" autoplay loop muted playsinline></video>`
                : `<img class="main-media" id="main-display" src="${url}">`;
            container.insertAdjacentHTML('afterbegin', newElement);

            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');

            if (!isAuto && window.productMediaArray) {
                window.currentSlideIndex = window.productMediaArray.indexOf(url);
                startAutoSlide();
            }
        }

        function selectColorIndex(idx, btn) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            const colorObj = window.currentProductColors[idx];
            window.currentSelectedColorName = colorObj.colorName;

            let mediaUrls = colorObj.media;
            
            if (!mediaUrls || mediaUrls.length === 0) {
                mediaUrls = ["https://via.placeholder.com/1080x1920?text=No+Image+For+" + encodeURIComponent(colorObj.colorName)];
            }

            window.productMediaArray = mediaUrls;
            window.currentSlideIndex = 0;

            const thumbContainer = document.querySelector('.thumbnail-row');
            thumbContainer.innerHTML = mediaUrls.map((url, index) => {
                const isVid = String(url).toLowerCase().endsWith('.mp4');
                const activeClass = index === 0 ? 'active' : '';
                if (isVid) return `<video class="thumb ${activeClass}" src="${url}" onclick="changeMedia('${url}', true, this)"></video>`;
                return `<img class="thumb ${activeClass}" src="${url}" onclick="changeMedia('${url}', false, this)">`;
            }).join('');

            changeMedia(mediaUrls[0], String(mediaUrls[0]).toLowerCase().endsWith('.mp4'), thumbContainer.firstElementChild);
        }

        async function loadProductPage() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');
                if (!productId) { document.getElementById('single-product-container').innerHTML = "<h3>Product not found.</h3>"; return; }

                const response = await fetch('/api/products');
                const allProducts = await response.json();
                const product = allProducts.find(p => p.id == productId);
                window.globalProductData = product;

                if (!product) { document.getElementById('single-product-container').innerHTML = "<h3>Product not found in database.</h3>"; return; }

                let initialMediaArray = ["https://via.placeholder.com/1080x1920?text=No+Image"];
                let colorsHtml = '';

                if (product.colors && product.colors.length > 0) {
                    initialMediaArray = product.colors[0].media.length > 0 ? product.colors[0].media : initialMediaArray;
                    window.currentSelectedColorName = product.colors[0].colorName;
                    
                    window.currentProductColors = product.colors; 
                    
                    colorsHtml = `
                        <div class="selector-section">
                            <span class="selector-label">Color</span>
                            <div class="selector-options">
                                ${product.colors.map((c, idx) => `
                                    <button class="selector-btn color-btn ${idx === 0 ? 'selected' : ''}" 
                                            onclick="selectColorIndex(${idx}, this)">
                                        ${c.colorName}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (product.media && product.media.length > 0) {
                    initialMediaArray = product.media; 
                }
                
                window.productMediaArray = initialMediaArray;

                const firstMedia = String(initialMediaArray[0]);
                const isMainVideo = firstMedia.toLowerCase().endsWith('.mp4');
                let mainMediaHtml = isMainVideo 
                    ? `<video class="main-media" id="main-display" src="${firstMedia}" autoplay loop muted playsinline></video>`
                    : `<img class="main-media" id="main-display" src="${firstMedia}">`;

                let thumbsHtml = initialMediaArray.map((url, index) => {
                    const isVid = String(url).toLowerCase().endsWith('.mp4');
                    const activeClass = index === 0 ? 'active' : '';
                    if (isVid) return `<video class="thumb ${activeClass}" src="${url}" onclick="changeMedia('${url}', true, this)"></video>`;
                    return `<img class="thumb ${activeClass}" src="${url}" onclick="changeMedia('${url}', false, this)">`;
                }).join('');

                const safePrice = Number(product.price) || 0;
                const safeOrig = Number(product.originalPrice) || 0;
                let priceHtml = (safeOrig > safePrice) ? `<span class="scratched-price">₹${safeOrig.toFixed(2)}</span><span class="selling-price">₹${safePrice.toFixed(2)}</span>` : `<span class="selling-price">₹${safePrice.toFixed(2)}</span>`;

                const safeName = product.name ? String(product.name).replace(/'/g, "\\'") : "Product";
                const displayCategory = (product.categories && product.categories.length > 0) ? product.categories.join(' | ') : (product.category || "Category");

                let sizesHtml = `<span style="font-size: 13px; color: #777;">One Size</span>`;
                if (product.sizes && product.sizes.length > 0) {
                    sizesHtml = product.sizes.map(size => `<button class="selector-btn size-btn" onclick="selectSize(this, '${size}')">${size}</button>`).join('');
                }

                // FORMAT INSTAGRAM REEL URL
                let instaHtml = '';
                if (product.instaReel && product.instaReel.includes('instagram.com/reel/')) {
                    let cleanUrl = product.instaReel.split('?')[0]; 
                    if (!cleanUrl.endsWith('/embed') && !cleanUrl.endsWith('/embed/')) {
                        cleanUrl = cleanUrl.replace(/\/$/, '') + '/embed';
                    }
                    
                    instaHtml = `
                        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee;">
                            <span class="selector-label" style="text-transform: uppercase; letter-spacing: 1px;">See it on Instagram</span>
                            <iframe src="${cleanUrl}" width="100%" height="500" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 8px; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 15px;"></iframe>
                        </div>
                    `;
                }

                document.getElementById('single-product-container').innerHTML = `
                    <div class="gallery-container">
                        <div class="zoom-wrapper" onmousemove="handleZoom(event)" onmouseleave="resetZoom()">
                            ${mainMediaHtml}
                        </div>
                        <div class="thumbnail-row">${thumbsHtml}</div>
                    </div>
                    <div class="details-container">
                        <div class="breadcrumb">${product.id} - ${displayCategory}</div>
                        <h1 class="product-title">${safeName}</h1>
                        <div class="price-row">${priceHtml}</div>
                        
                        ${colorsHtml}

                        <div class="selector-section">
                            <span class="selector-label">Size</span>
                            <div class="selector-options">${sizesHtml}</div>
                        </div>

                        <div class="action-row">
                            <input type="number" id="qty-input" class="qty-input" value="1" min="1">
                            <button class="btn-add" onclick="addToBasket(${product.id}, '${safeName}', ${safePrice})">ADD TO BAG</button>
                            <button class="btn-buy" onclick="buyNow(${product.id}, '${safeName}', ${safePrice})">BUY NOW</button>
                        </div>
                        
                        <div class="tabs"><div class="tab active">DESCRIPTION</div></div>
                        <div class="description-content"><p>${(product.description || '').replace(/\n/g, '<br>')}</p></div>
                        
                        ${instaHtml} 
                    </div>
                `;

                startAutoSlide();
                renderCommentsFeed(product.comments);

                const mainCat = (product.categories && product.categories.length > 0) ? product.categories[0] : product.category;
                const relatedProducts = allProducts.filter(p => p.id != productId && (
                    (p.categories && p.categories.includes(mainCat)) || p.category === mainCat
                )).slice(0, 4);
                
                if (relatedProducts.length > 0) {
                    document.getElementById('related-grid').innerHTML = relatedProducts.map(rel => {
                        let rMedia = (rel.colors && rel.colors[0]?.media[0]) || (rel.media && rel.media[0]) || "https://via.placeholder.com/1080x1920";
                        let rMediaStr = String(rMedia);
                        let relMediaHtml = rMediaStr.toLowerCase().endsWith('.mp4') ? `<video src="${rMediaStr}" autoplay loop muted playsinline></video>` : `<img src="${rMediaStr}">`;
                        let rPrice = Number(rel.price) || 0;
                        let rOrig = Number(rel.originalPrice) || 0;
                        let relPriceHtml = (rOrig > rPrice) ? `<span style="text-decoration:line-through; color:#999; margin-right:5px;">₹${rOrig.toFixed(2)}</span>₹${rPrice.toFixed(2)}` : `₹${rPrice.toFixed(2)}`;
                        
                        return `
                            <a href="product.html?id=${rel.id}" class="product-card">
                                ${relMediaHtml}
                                <div class="product-card-title">${rel.name}</div>
                                <div class="product-card-price">${relPriceHtml}</div>
                            </a>
                        `;
                    }).join('');
                }

            } catch (error) { console.error("Error:", error); }
        }

        function renderCommentsFeed(comments) {
            const feed = document.getElementById('comments-feed');
            if (!comments || comments.length === 0) {
                feed.innerHTML = `<p style="color: #777; font-size:14px; font-style:italic;">No questions or reviews yet. Be the first!</p>`;
                return;
            }
            
            feed.innerHTML = comments.slice().reverse().map(c => `
                <div class="comment-box">
                    <div class="comment-meta">
                        <strong>${c.user}</strong>
                        <span>${new Date(c.createdAt).toLocaleDateString()}</span>
                    </div>
                    <p style="margin:0; font-size:14px;">${c.text}</p>
                    ${c.reply ? `<div class="comment-reply"><strong>Mridini Support:</strong> ${c.reply}</div>` : ''}
                </div>
            `).join('');
        }

        async function submitComment() {
            if(!window.globalProductData) return;
            const text = document.getElementById('comment-text').value.trim();
            const user = document.getElementById('comment-user').value.trim();
            if(!text) return alert('Please write a comment first.');

            try {
                const res = await fetch(`/api/products/${window.globalProductData.id}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, text })
                });
                if(res.ok) {
                    const updatedProduct = await res.json();
                    renderCommentsFeed(updatedProduct.comments);
                    document.getElementById('comment-text').value = '';
                }
            } catch(e) { console.error(e); }
        }

        let currentSelectedSize = null; 

        function selectSize(btn, size) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            currentSelectedSize = size;
        }

        function addToBasket(id, name, price) {
            if (!currentSelectedSize && document.querySelectorAll('.size-btn').length > 0) {
                alert('Please select a size!'); return false; 
            }
            
            const currentImage = document.getElementById('main-display').src;
            const qty = parseInt(document.getElementById('qty-input').value) || 1;
            const finalSize = currentSelectedSize || 'One Size';
            
            const fullNameVariant = `${name} (${window.currentSelectedColorName})`;

            const cartItem = { id, name: fullNameVariant, price, image: currentImage, size: finalSize, qty };
            let cart = JSON.parse(localStorage.getItem('mridini_cart')) || [];

            const existingIndex = cart.findIndex(item => item.id === id && item.size === finalSize && item.name === fullNameVariant);
            if (existingIndex > -1) cart[existingIndex].qty += qty; 
            else cart.push(cartItem); 

            localStorage.setItem('mridini_cart', JSON.stringify(cart));
            updateCartBadge();

            const btn = document.querySelector('.btn-add');
            const origText = btn.innerText, origColor = btn.style.backgroundColor;
            btn.innerText = '✓ ADDED'; btn.style.backgroundColor = '#4CAF50'; 
            setTimeout(() => { btn.innerText = origText; btn.style.backgroundColor = origColor; }, 2000);
            return true;
        }

        function buyNow(id, name, price) {
            if (addToBasket(id, name, price)) window.location.href = 'cart.html'; 
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('mridini_cart')) || [];
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('.cart-count').forEach(badge => badge.innerText = total);
        }

        updateCartBadge();
        loadProductPage();

        fetch('header.html').then(r => r.text()).then(d => {
            document.getElementById('header-placeholder').innerHTML = d;
            const s = document.getElementById('header-placeholder').getElementsByTagName('script');
            for(let i=0; i<s.length; i++) eval(s[i].innerText);
        });
        fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
    </script>
</body>
</html>
